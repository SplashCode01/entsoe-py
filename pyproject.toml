[project]
name = "entsoe-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SplashCode (Shota)", email = "shota.goginashvili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
entsoe-py = "entsoe_py:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: basic style errors
    "F",    # pyflakes: unused imports, undefined names, real bugs
    "I",    # isort: import ordering
    "B",    # flake8-bugbear: common footguns (mutable default args, etc.)
    "UP",   # pyupgrade: use modern syntax for the target Python version
    "SIM",  # flake8-simplify: needlessly complicated code
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
